name: Prepare release version (temporary)

on:
  push:
    branches: [feat/ui-themes-liquid-glass]
    paths: ['.github/workflows/prepare-release-version.yml']

permissions:
  contents: read

jobs:
  sync-version:
    if: github.repository == 'GreFir/LensBorder-Pro' && github.ref == 'refs/heads/feat/ui-themes-liquid-glass'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Synchronize application metadata without updating dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import tomllib
          from pathlib import Path

          expected = {
              'package.json': '7ff59486e4829d111edf10612751fcc577e7415d',
              'package-lock.json': '2caf09b0a954746b1a7c01b2349eadff8b47f334',
              'src-tauri/tauri.conf.json': 'e0f4b1f8600667db151e6a14af60b26b1b559477',
              'src-tauri/Cargo.toml': '046b2025a5a93e8d9e52f4a9ee312d0ae218132d',
              'src-tauri/Cargo.lock': '4382604d35fbe7e069ec0b92548850b81c1173cb',
          }
          originals = {}
          for filename, sha in expected.items():
              data = Path(filename).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha, f'Concurrent change detected: {filename}'
              originals[filename] = data.decode('utf-8')

          edits = {
              'package.json': [('"version": "0.1.1"', '"version": "0.1.2"')],
              'src-tauri/tauri.conf.json': [('"version": "0.1.1"', '"version": "0.1.2"')],
              'src-tauri/Cargo.toml': [('name = "app"\nversion = "0.1.0"', 'name = "app"\nversion = "0.1.2"')],
              'src-tauri/Cargo.lock': [('name = "app"\nversion = "0.1.0"', 'name = "app"\nversion = "0.1.2"')],
              'package-lock.json': [
                  ('{\n  "name": "my-presentation",\n  "version": "0.0.0",', '{\n  "name": "lensborder-pro",\n  "version": "0.1.2",'),
                  ('    "": {\n      "name": "my-presentation",\n      "version": "0.0.0",', '    "": {\n      "name": "lensborder-pro",\n      "version": "0.1.2",'),
              ],
          }
          results = {}
          for filename, replacements in edits.items():
              text = originals[filename]
              for before, after in replacements:
                  assert text.count(before) == 1, f'Unexpected metadata: {filename}'
                  text = text.replace(before, after, 1)
              results[filename] = text

          for filename in ('package.json', 'src-tauri/tauri.conf.json'):
              expected_json = json.loads(originals[filename])
              expected_json['version'] = '0.1.2'
              assert json.loads(results[filename]) == expected_json
          expected_lock = json.loads(originals['package-lock.json'])
          expected_lock['name'] = expected_lock['packages']['']['name'] = 'lensborder-pro'
          expected_lock['version'] = expected_lock['packages']['']['version'] = '0.1.2'
          assert json.loads(results['package-lock.json']) == expected_lock
          expected_cargo = tomllib.loads(originals['src-tauri/Cargo.toml'])
          expected_cargo['package']['version'] = '0.1.2'
          assert tomllib.loads(results['src-tauri/Cargo.toml']) == expected_cargo
          expected_cargo_lock = tomllib.loads(originals['src-tauri/Cargo.lock'])
          apps = [p for p in expected_cargo_lock['package'] if p['name'] == 'app' and 'source' not in p]
          assert len(apps) == 1
          apps[0]['version'] = '0.1.2'
          assert tomllib.loads(results['src-tauri/Cargo.lock']) == expected_cargo_lock

          for filename, text in results.items():
              Path(filename).write_bytes(text.encode('utf-8'))
              print(f'{filename}: application version 0.1.2; dependency data unchanged')
          PY
          git diff --check
          git diff --stat
      - name: Commit only the five application metadata files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m 'chore(release): align application metadata and lockfiles to 0.1.2'
          git push origin HEAD:refs/heads/feat/ui-themes-liquid-glass
